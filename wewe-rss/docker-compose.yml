version: '3.9'

services:
  app:
    image: schoolsearch-rss:20261103-audit
    pull_policy: never
    init: true
    env_file: ./portal-container.env
    command: ["node", "dist/main"]
    mem_limit: 256m
    memswap_limit: 512m
    stop_grace_period: 24h
    container_name: wewe-rss
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - 127.0.0.1:4000:4000
    environment:
      - DATABASE_TYPE=sqlite
      - AUTH_CODE=
      - SCHOOLSEARCH_PUBLIC_WORKSPACE=1
      - SCHOOLSEARCH_PUBLIC_ORIGIN=https://schoolsearchzzychen.online
      - SERVER_ORIGIN_URL=https://schoolsearchzzychen.online/hys/rss
      - CRON_EXPRESSION=35 5,17 * * *
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    networks:
      - default
      - hys

networks:
  hys:
    external: true
    name: hys_default
